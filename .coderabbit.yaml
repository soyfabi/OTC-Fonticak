# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"

early_access: true

reviews:
  profile: "chill"

  request_changes_workflow: false

  high_level_summary: true
  changed_files_summary: true
  review_status: true
  collapse_walkthrough: false

  sequence_diagrams: true
  related_prs: true
  suggested_labels: true

  auto_review:
    enabled: true
    drafts: false

  path_filters:
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.gif"
    - "!**/*.bmp"
    - "!**/*.ico"
    - "!**/*.mp3"
    - "!**/*.ogg"
    - "!**/*.wav"
    - "!**/*.spr"
    - "!**/*.dat"
    - "!**/*.otb"
    - "!**/*.dll"
    - "!**/*.exe"
    - "!**/*.zip"
    - "!**/*.7z"

  path_instructions:

    - path: "src/**"
      instructions: |
        Review this as C++ code for an OTClient-based MMORPG client.

        Prioritize:
        - crashes
        - memory safety
        - null pointer dereferences
        - lifetime and ownership problems
        - performance regressions
        - unnecessary allocations
        - threading and race conditions
        - rendering performance
        - networking issues
        - game-loop performance
        - regressions caused by ports from other OTClient forks

        Verify that APIs used by a port actually exist in OTC-Fonticak.
        Do not assume APIs from another OTClient fork are available here.

        Prefer small, compatible fixes over unnecessary rewrites.

    - path: "modules/**/*.lua"
      instructions: |
        Review this as OTClient Lua module code.

        Pay special attention to:
        - nil access
        - incorrect event connections
        - timers that are never cancelled
        - widgets that are never destroyed
        - duplicated functionality
        - unnecessary global variables
        - expensive callbacks
        - incorrect g_game usage
        - incorrect g_ui usage
        - incorrect g_map usage
        - module lifecycle problems
        - compatibility with existing OTC-Fonticak modules

        Prefer existing OTC-Fonticak patterns over introducing new abstractions.

    - path: "modules/**/*.otui"
      instructions: |
        Review OTUI changes for actual functional problems.

        Check:
        - widget hierarchy
        - IDs
        - parent/child relationships
        - anchors
        - layout behavior
        - invalid properties
        - duplicated styles
        - missing widget references
        - compatibility with related Lua code

        Avoid subjective UI/style comments unless they can cause a real problem.

    - path: "data/**"
      instructions: |
        Review data changes for compatibility and correctness.

        Check:
        - invalid paths
        - missing resources
        - malformed configuration
        - duplicated configuration
        - compatibility with existing OTC-Fonticak modules

  tone_instructions: |
    Act as a senior developer reviewing an actively maintained OTClient fork.

    Focus on real bugs, regressions, crashes, security issues,
    compatibility problems, performance issues and maintainability.

    Avoid nitpicking formatting or subjective style preferences.

    When reviewing a port from another OTClient fork, verify that the
    implementation matches APIs and architecture actually available
    in OTC-Fonticak.

    For important findings:
    1. Explain what is wrong.
    2. Explain why it matters.
    3. Identify the affected code.
    4. Suggest a practical fix.

chat:
  auto_reply: true